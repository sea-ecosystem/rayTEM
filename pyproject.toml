[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raytem"
version = "0.0.1beta"
description = "Ray-tracing TEM simulator and calibration framework for the SEA ecosystem."
readme = "README.md"
requires-python = ">=3.8,<3.18"
dependencies = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas",
    "scipy>=1.16.3",
    # "sea-eco",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0"]
wiki = ["sea-ecosystem"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pySEA*"]

[tool.pytest.ini_options]
testpaths = ["src/pySEA/rayTEM/tests"]
python_files = ["test_*.py"]
