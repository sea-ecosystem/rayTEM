name: docs

# Rebuild the Sphinx site and commit the refreshed HTML back to the pushed
# branch. The rendered site is repository content here (docs/_build/html is
# tracked), so any push that changes docstrings or docs sources must refresh
# it -- this job does that so nobody has to remember.
#
# Loop safety: the bot's own commit only touches docs/_build/html, whose
# rebuild is then a no-op diff, so the follow-up run commits nothing.

on:
  push:
    paths:
      - "docs/**"
      - "src/**/*.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sea-eco is a private sibling and is NOT needed: seashells degrades
      # gracefully without it, and the build was verified identical either
      # way. --no-deps skips it; the runtime deps autodoc actually imports
      # are installed explicitly.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas
          pip install --no-deps -e .
          pip install -r docs/requirements.txt

      - name: Build
        run: |
          rm -rf docs/_build/html
          sphinx-build -d docs/_build/doctrees docs docs/_build/html

      - name: Commit refreshed site
        run: |
          git add docs/_build/html
          if git diff --cached --quiet; then
            echo "site unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: rebuild site [skip ci]"
          git push
